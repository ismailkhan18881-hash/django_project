{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – QuitCig</title>
 <!-- login page has its own layout does not use base.html --> 
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

<!-- Full page centered wrapper for the login card -->
<div class="login-wrapper">
  <div class="login-card">

    <!-- App logo and name at the top of the card -->
    <div class="login-logo">✦</div>
    <h1>QuitCig</h1>
    <p>Your journey to a smoke free life starts here.</p>

    <!-- The login form posts to Django's built in authentication view -->
    <!-- Django handles checking the username and password -->
    <form method="post" style="text-align:left;">
      {% csrf_token %}
      <!-- csrf_token is a security token Django requires on all POST forms -->
      <!-- It prevents cross site request forgery attacks -->

      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username"
               placeholder="Enter your username" autofocus>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password"
               placeholder="Enter your password">
      </div>

      <!-- Show an error message if the username or password was wrong -->
      {% if form.errors %}
        <div class="alert alert-error" style="margin-bottom:14px;">
          Incorrect username or password. Please try again.
        </div>
      {% endif %}

      <button type="submit" class="btn-primary">Login</button>
    </form>

    <p style="margin-top:20px; font-size:13px; color:#6b7280;">
      New here?
      <a href="{% url 'register' %}" style="color:#6c3fc5; font-weight:600; text-decoration:none;">
        Create a free account
      </a>
    </p>

  </div>
</div>

</body>
</html>
