{% extends "base.html" %}
{% block title %}Progress Saved{% endblock %}

{% block content %}
<h2>Progress Saved</h2>

<p><strong>Date:</strong> {{ log.date }}</p>
<p><strong>Cigarettes smoked:</strong> {{ log.cigarettes_smoked }}</p>
<p><strong>Money saved:</strong> £{{ log.money_saved }}</p>

<div style="margin-top:16px;">
    <a class="btn" href="{% url 'progress' %}">Log another day</a>
    <a class="btn" style="margin-left:10px;" href="{% url 'plan' %}">View Plan</a>
</div>
{% endblock %}
